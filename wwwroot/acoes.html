    <script>
        const API_URL = "http://localhost:5009/api/cvm";
        let chartInstance = null;

        function exibirStatusSync(mensagem, isSucesso) {
            const statusDiv = document.getElementById('syncStatus');
            statusDiv.classList.remove('hidden', 'bg-emerald-950', 'text-emerald-400', 'bg-red-950', 'text-red-400', 'border-emerald-800', 'border-red-800');
            statusDiv.classList.add('border', isSucesso ? 'bg-emerald-950' : 'bg-red-950', isSucesso ? 'text-emerald-400' : 'text-red-400', isSucesso ? 'border-emerald-800' : 'border-red-800');
            statusDiv.innerText = mensagem;
        }

        async function sincronizarCompanhiasAbertas() {
            const btn = document.getElementById('btnSyncAcoes');
            btn.disabled = true;
            btn.innerText = "Sincronizando...";
            exibirStatusSync("Baixando cadastros de Companhias Abertas da CVM...", true);

            try {
                const response = await fetch(`${API_URL}/acoes/sincronizar`, { method: 'POST' });
                const data = await response.json();
                if (response.ok) exibirStatusSync(`✅ ${data.mensagem} Total: ${data.totalEmpresasCadastradas} empresas.`, true);
                else throw new Error(data.mensagem || "Erro ao sincronizar empresas.");
            } catch (err) {
                exibirStatusSync(`❌ Erro: ${err.message}`, false);
            } finally {
                btn.disabled = false;
                btn.innerText = "Sincronizar Cadastros de Ações";
            }
        }

        async function buscarAcao() {
            const termo = document.getElementById('inputAcao').value.trim();
            const errorElement = document.getElementById('erroAcao');
            errorElement.classList.add('hidden');

            if (!termo) {
                errorElement.innerText = "Por favor, digite um Ticker ou CNPJ.";
                errorElement.classList.remove('hidden');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/acao/cotacao/${encodeURIComponent(termo)}`);
                if (!response.ok) throw new Error("Nenhum dado encontrado para este Ticker/CNPJ.");

                const data = await response.json();
                renderizarAcao(data);
            } catch (err) {
                errorElement.innerText = err.message;
                errorElement.classList.remove('hidden');
            }
        }

        function renderizarAcao(data) {
            document.getElementById('cardInfoAcao').classList.remove('hidden');
            document.getElementById('chartSectionAcao').classList.remove('hidden');

            const historico = data.historicoPrecos;
            const ultimoRegistro = historico[historico.length - 1];

            document.getElementById('infoTicker').innerText = data.tickerIdentificado;
            document.getElementById('infoSubAcao').innerText = `Pesquisado: ${data.termoPesquisado} | Total Registros: ${data.totalRegistros}`;
            document.getElementById('infoPrecoAcao').innerText = `R$ ${ultimoRegistro.fechamento.toFixed(2)}`;

            const labels = historico.map(h => h.data);
            const precos = historico.map(h => h.fechamento);
            const ctx = document.getElementById('stockChart').getContext('2d');

            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: `Fechamento (R$) - ${data.tickerIdentificado}`,
                        data: precos,
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        fill: true,
                        tension: 0.2,
                        pointRadius: 0,
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#cbd5e1' } } },
                    scales: {
                        x: { ticks: { color: '#64748b' }, grid: { color: '#334155' } },
                        y: { ticks: { color: '#64748b' }, grid: { color: '#334155' } }
                    }
                }
            });
        }
    </script>
