    <script>
        const API_URL = "http://localhost:5009/api/cvm";

        function exibirStatusSync(mensagem, isSucesso) {
            const statusDiv = document.getElementById('syncStatus');
            statusDiv.classList.remove('hidden', 'bg-emerald-950', 'text-emerald-400', 'bg-red-950', 'text-red-400', 'border-emerald-800', 'border-red-800');
            statusDiv.classList.add('border', isSucesso ? 'bg-emerald-950' : 'bg-red-950', isSucesso ? 'text-emerald-400' : 'text-red-400', isSucesso ? 'border-emerald-800' : 'border-red-800');
            statusDiv.innerText = mensagem;
        }

        async function sincronizarCadastroFundos() {
            const btn = document.getElementById('btnSyncFundos');
            btn.disabled = true;
            btn.innerText = "Sincronizando...";
            exibirStatusSync("Baixando e processando cadastros da CVM... Aguarde.", true);

            try {
                const response = await fetch(`${API_URL}/cadastros/sincronizar`, { method: 'POST' });
                const data = await response.json();
                if (response.ok) {
                    exibirStatusSync(`✅ ${data.mensagem} Total: ${data.totalFundosCadastrados} fundos.`, true);
                    carregarFundosBaixados();
                } else throw new Error(data.mensagem || "Erro ao sincronizar fundos.");
            } catch (err) {
                exibirStatusSync(`❌ Erro: ${err.message}`, false);
            } finally {
                btn.disabled = false;
                btn.innerText = "Sincronizar Cadastro";
            }
        }

        async function sincronizarCotasDiarias() {
            const inputData = document.getElementById('inputDataSync').value;
            const btn = document.getElementById('btnSyncDiario');

            if (!inputData) {
                exibirStatusSync("⚠️ Por favor, selecione uma data para sincronizar.", false);
                return;
            }

            const [ano, mes, dia] = inputData.split('-');
            const dataFormatada = `${dia}-${mes}-${ano}`;

            btn.disabled = true;
            btn.innerText = "Processando...";
            exibirStatusSync(`Baixando informes da CVM para o dia ${dataFormatada}...`, true);

            try {
                const response = await fetch(`${API_URL}/sincronizar/${dataFormatada}`, { method: 'POST' });
                const data = await response.json();
                if (response.ok) exibirStatusSync(`✅ ${data.mensagem} Data: ${data.dataSincronizada} | Registros importados: ${data.registrosNovos}`, true);
                else throw new Error(data.mensagem || "Erro ao sincronizar informes.");
            } catch (err) {
                exibirStatusSync(`❌ Erro: ${err.message}`, false);
            } finally {
                btn.disabled = false;
                btn.innerText = "Importar Informes da Data";
            }
        }

        async function buscarFundo() {
            const cnpj = document.getElementById('inputFundo').value.trim();
            const errorElement = document.getElementById('erroFundo');
            errorElement.classList.add('hidden');

            if (!cnpj) {
                errorElement.innerText = "Por favor, digite o CNPJ do fundo.";
                errorElement.classList.remove('hidden');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/fundo/${encodeURIComponent(cnpj)}`);
                if (!response.ok) throw new Error("Fundo não encontrado no banco local.");

                const data = await response.json();
                renderizarFundo(data);
            } catch (err) {
                errorElement.innerText = err.message;
                errorElement.classList.remove('hidden');
            }
        }

        function renderizarFundo(data) {
    document.getElementById('cardInfoFundo').classList.remove('hidden');
    document.getElementById('tabelaCotasSection').classList.remove('hidden');

    const cadastro = data.cadastros && data.cadastros.length > 0 ? data.cadastros[0] : null;

    document.getElementById('fundoCnpj').innerText = data.cnpj || '-';
    document.getElementById('fundoRazaoSocial').innerText = cadastro ? (cadastro.razaoSocial || cadastro.RazaoSocial) : 'Razão Social não cadastrada';
    document.getElementById('fundoNomeFantasia').innerText = cadastro && (cadastro.nomeComercial || cadastro.NomeComercial) ? `Nome Fantasia: ${cadastro.nomeComercial || cadastro.NomeComercial}` : '';
    document.getElementById('fundoSituacao').innerText = cadastro ? (cadastro.situacao || cadastro.Situacao) : '-';
    document.getElementById('fundoAdmin').innerText = cadastro ? (cadastro.administrador || cadastro.Administrador || 'Não informado') : '-';

    const tbody = document.getElementById('tabelaCotasCorpo');
    tbody.innerHTML = '';

    // Aceita tanto historicoCotas quanto HistoricoCotas
    const cotas = data.historicoCotas || data.HistoricoCotas || [];

    if (!cotas || cotas.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-slate-500">Nenhum histórico de cotas importado para este CNPJ. Selecione uma data e clique em "Importar Informes da Data".</td></tr>`;
        return;
    }

    cotas.forEach(item => {
        // Mapeia flexivelmente as propriedades para evitar problemas com casing
        const dataStr = item.data || item.Data || item.dataInforme || item.DataInforme || '-';
        const valorCota = item.valorCota ?? item.ValorCota ?? 0;
        const patrimonio = item.patrimonioLiquido ?? item.PatrimonioLiquido ?? 0;

        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-700/50 transition-colors';
        tr.innerHTML = `
            <td class="p-3 font-mono text-slate-200">${dataStr}</td>
            <td class="p-3 font-semibold text-emerald-400">R$ ${Number(valorCota).toLocaleString('pt-BR', { minimumFractionDigits: 4, maximumFractionDigits: 6 })}</td>
            <td class="p-3 text-slate-300">R$ ${Number(patrimonio).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>
        `;
        tbody.appendChild(tr);
    });
}

        async function carregarFundosBaixados() {
            const filtro = document.getElementById('inputFiltroFundos').value.trim();
            const situacao = document.getElementById('selectSituacaoFundo').value;
            const tbody = document.getElementById('tabelaFundosBaixadosCorpo');
            
            tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400">Carregando fundos...</td></tr>`;

            try {
                const url = `${API_URL}/fundos/listar?busca=${encodeURIComponent(filtro)}&situacao=${encodeURIComponent(situacao)}&quantidade=50`;
                const response = await fetch(url);
                if (!response.ok) throw new Error("Erro ao carregar lista de fundos.");

                const data = await response.json();
                document.getElementById('totalFundosBanco').innerText = data.totalNoBanco;

                tbody.innerHTML = '';

                if (!data.fundos || data.fundos.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-500">Nenhum fundo encontrado para este filtro.</td></tr>`;
                    return;
                }

                data.fundos.forEach(fundo => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-slate-700/50 transition-colors';
                    tr.innerHTML = `
                        <td class="p-3 font-mono text-emerald-400">${fundo.cnpjFundo}</td>
                        <td class="p-3 font-medium text-slate-200">${fundo.razaoSocial}</td>
                        <td class="p-3">
                            <span class="px-2 py-0.5 text-xs rounded border ${obterBadgeColor(fundo.situacao)}">
                                ${fundo.situacao}
                            </span>
                        </td>
                        <td class="p-3 text-slate-400 text-xs">${fundo.administrador || 'Não informado'}</td>
                        <td class="p-3 text-center">
                            <button type="button" onclick="selecionarFundoEBuscar('${fundo.cnpjFundo}')" 
                                    class="bg-emerald-600/20 text-emerald-400 border border-emerald-800 hover:bg-emerald-600 hover:text-white text-xs px-2.5 py-1 rounded transition-colors">
                                Ver Cotas
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-400">❌ ${err.message}</td></tr>`;
            }
        }

        function obterBadgeColor(situacao) {
            switch ((situacao || '').toUpperCase()) {
                case 'EM FUNCIONAMENTO NORMAL': return 'bg-emerald-950 text-emerald-400 border-emerald-800';
                case 'CANCELADA': return 'bg-red-950 text-red-400 border-red-800';
                case 'EM LIQUIDAÇÃO': return 'bg-amber-950 text-amber-400 border-amber-800';
                default: return 'bg-slate-900 text-slate-400 border-slate-700';
            }
        }

        function selecionarFundoEBuscar(cnpj) {
            document.getElementById('inputFundo').value = cnpj;
            buscarFundo();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
